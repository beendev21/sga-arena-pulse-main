<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0c13;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1018;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d94f2b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8861e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d94f2b;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#d94f2b;stop-opacity:0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Top glow -->
  <ellipse cx="600" cy="0" rx="600" ry="280" fill="url(#glowGrad)" />

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="url(#accentGrad)" />

  <!-- Bottom accent line -->
  <rect x="0" y="612" width="1200" height="4" fill="url(#accentGrad)" opacity="0.5" />

  <!-- Corner decoration top-right -->
  <polyline points="1140,20 1180,20 1180,60" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Corner decoration bottom-left -->
  <polyline points="60,610 20,610 20,570" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Decorative diagonal lines background -->
  <line x1="800" y1="0" x2="1200" y2="630" stroke="rgba(217,79,43,0.06)" stroke-width="120"/>
  <line x1="900" y1="0" x2="1200" y2="400" stroke="rgba(232,134,30,0.04)" stroke-width="80"/>

  <!-- Main content block -->
  <!-- Label chip -->
  <rect x="60" y="160" width="160" height="32" fill="rgba(217,79,43,0.15)" rx="0"/>
  <rect x="60" y="160" width="3" height="32" fill="url(#accentGrad)"/>
  <text x="74" y="181" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="13" font-weight="700" fill="#d94f2b" letter-spacing="3" text-transform="uppercase">PLATAFORMA OFICIAL</text>

  <!-- SGA big title -->
  <text x="56" y="310" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="148" font-weight="900" font-style="italic" fill="white" letter-spacing="-4" opacity="0.97">SGA</text>

  <!-- Accent bar under SGA -->
  <rect x="56" y="318" width="340" height="5" fill="url(#accentGrad)" rx="0"/>

  <!-- Full name -->
  <text x="58" y="374" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.6)" letter-spacing="6">SANTOS GAMES ARENA</text>

  <!-- Divider -->
  <line x1="56" y1="406" x2="460" y2="406" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Tagline -->
  <text x="58" y="442" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="20" font-weight="400" fill="rgba(255,255,255,0.45)" letter-spacing="1">Campeonatos · Rankings · Partidas ao Vivo</text>

  <!-- Games chips -->
  <rect x="58" y="468" width="72" height="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="0"/>
  <text x="94" y="486" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">CS2</text>

  <rect x="140" y="468" width="100" height="26" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="0"/>
  <text x="190" y="486" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">VALORANT</text>

  <!-- Right side: large decorative element -->
  <text x="720" y="480" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="440" font-weight="900" font-style="italic" fill="rgba(255,255,255,0.018)" letter-spacing="-20">A</text>

  <!-- Right stats decoration -->
  <g transform="translate(760, 200)">
    <!-- stat block 1 -->
    <rect x="0" y="0" width="160" height="80" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="3" fill="url(#accentGrad)" opacity="0.6"/>
    <text x="80" y="38" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="32" font-weight="900" font-style="italic" fill="white" text-anchor="middle">TOP 40</text>
    <text x="80" y="62" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">JOGADORES</text>

    <!-- stat block 2 -->
    <rect x="180" y="0" width="160" height="80" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect x="180" y="0" width="160" height="3" fill="url(#accentGrad)" opacity="0.6"/>
    <text x="260" y="38" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="32" font-weight="900" font-style="italic" fill="white" text-anchor="middle">RANKING</text>
    <text x="260" y="62" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">GERAL</text>

    <!-- stat block 3 -->
    <rect x="0" y="100" width="340" height="80" fill="rgba(217,79,43,0.06)" stroke="rgba(217,79,43,0.15)" stroke-width="1"/>
    <rect x="0" y="100" width="340" height="3" fill="url(#accentGrad)"/>
    <text x="170" y="146" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="22" font-weight="700" font-style="italic" fill="white" text-anchor="middle" letter-spacing="2">PARTIDAS AO VIVO</text>
    <text x="170" y="168" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="2">EM TEMPO REAL</text>
  </g>

  <!-- URL footer -->
  <text x="600" y="590" font-family="'Barlow Condensed', Arial Narrow, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.2)" text-anchor="middle" letter-spacing="3">SANTOS-GAMES.COM</text>
</svg>
