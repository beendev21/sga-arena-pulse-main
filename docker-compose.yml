version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "80:80"
    restart: always
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
